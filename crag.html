<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <title>CRAG</title>
  <style>
/* ─── Dark Apple — Vision Pro / Music materials ─────────────────── */
:root {
  --bg: #000000;
  --bg-elev: #0c0c0e;
  --surface: rgba(255, 255, 255, 0.045);
  --surface-2: rgba(255, 255, 255, 0.07);
  --surface-3: rgba(255, 255, 255, 0.1);
  --surface-solid: #141416;
  --surface-solid-2: #1c1c1f;

  --fg: #f5f5f7;
  --fg-2: rgba(235, 235, 245, 0.72);
  --muted: rgba(235, 235, 245, 0.48);
  --meta: rgba(235, 235, 245, 0.32);

  --hairline: rgba(255, 255, 255, 0.08);
  --hairline-strong: rgba(255, 255, 255, 0.14);
  --hairline-soft: rgba(255, 255, 255, 0.05);

  /* Single luminous accent — system blue */
  --accent: #0a84ff;
  --accent-soft: rgba(10, 132, 255, 0.18);
  --accent-glow: rgba(10, 132, 255, 0.35);
  --accent-on: #ffffff;

  /* Correction branch — warm signal, not neon */
  --branch: #ff9f0a;
  --branch-soft: rgba(255, 159, 10, 0.16);
  --branch-fg: #ffb340;

  --success: #30d158;
  --success-soft: rgba(48, 209, 88, 0.14);
  --danger: #ff453a;
  --danger-soft: rgba(255, 69, 58, 0.16);
  --warn: #ffd60a;
  --warn-soft: rgba(255, 214, 10, 0.14);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
    "Segoe UI", system-ui, sans-serif;
  --font-mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;

  --text-xs: 12px;
  --text-sm: 13px;
  --text-base: 15px;
  --text-md: 17px;
  --text-lg: 22px;
  --text-xl: 28px;
  --text-2xl: 34px;
  --text-3xl: 40px;

  --leading-tight: 1.15;
  --leading-body: 1.55;
  --tracking-tight: -0.022em;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-pill: 9999px;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 24px 64px rgba(0, 0, 0, 0.55);
  --shadow-focus: 0 0 0 3px rgba(10, 132, 255, 0.45);
  --shadow-input: 0 0 0 1px var(--hairline), 0 8px 32px rgba(0, 0, 0, 0.35);

  --motion-fast: 140ms;
  --motion-base: 240ms;
  --motion-panel: 420ms;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-panel: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);

  --compose-max: 640px;
  --content-max: 720px;
  --topbar-h: 52px;
  --z-backdrop: 40;
  --z-drawer: 50;
  --z-modal: 60;
  --z-toast: 80;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html {
  -webkit-text-size-adjust: 100%;
  color-scheme: dark;
  background: var(--bg);
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: var(--text-base);
  line-height: var(--leading-body);
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}
img, svg { display: block; max-width: 100%; }
button {
  font: inherit;
  cursor: pointer;
  color: inherit;
  background: none;
  border: none;
  padding: 0;
}
p { margin: 0; text-wrap: pretty; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: var(--tracking-tight); }
:focus { outline: none; }
:focus-visible { box-shadow: var(--shadow-focus); border-radius: var(--radius-sm); }
::selection { background: rgba(10, 132, 255, 0.35); color: var(--fg); }

/* ─── App shell ─────────────────────────────────────────────────── */
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(10, 132, 255, 0.08), transparent 55%),
    radial-gradient(800px 400px at 80% 100%, rgba(255, 159, 10, 0.03), transparent 50%),
    var(--bg);
}

.topbar {
  flex: 0 0 auto;
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-5);
  border-bottom: 1px solid transparent;
  transition: border-color var(--motion-base) var(--ease-standard),
    background var(--motion-base) var(--ease-standard);
  position: relative;
  z-index: 10;
}
.topbar.has-border {
  border-bottom-color: var(--hairline);
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: linear-gradient(145deg, #1a1a1e 0%, #0a0a0c 100%);
  border: 1px solid var(--hairline-strong);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--fg);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
}
.brand-name {
  font-size: var(--text-sm);
  font-weight: 600;
  letter-spacing: -0.01em;
}
.brand-sub {
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
  margin-left: 2px;
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.main {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  scroll-behavior: smooth;
}

.main-inner {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: var(--space-8) var(--space-5) var(--space-16);
}

/* ─── Buttons ───────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-radius: var(--radius-pill);
  font-weight: 500;
  transition:
    background var(--motion-fast) var(--ease-standard),
    color var(--motion-fast) var(--ease-standard),
    transform var(--motion-fast) var(--ease-standard),
    opacity var(--motion-fast) var(--ease-standard),
    border-color var(--motion-fast) var(--ease-standard);
  white-space: nowrap;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}
.btn-sm {
  height: 32px;
  padding: 0 12px;
  font-size: var(--text-xs);
  min-height: 32px;
}
.btn-md {
  height: 36px;
  padding: 0 16px;
  font-size: var(--text-sm);
  min-height: 36px;
}
.btn-lg {
  height: 44px;
  padding: 0 20px;
  font-size: var(--text-base);
  min-height: 44px;
}
.btn-icon {
  width: 36px;
  height: 36px;
  padding: 0;
  border-radius: var(--radius-pill);
}
.btn-icon.btn-sm { width: 32px; height: 32px; }
.btn-primary {
  background: var(--accent);
  color: var(--accent-on);
  box-shadow: 0 1px 0 rgba(255,255,255,0.12) inset, 0 4px 12px rgba(10, 132, 255, 0.25);
}
.btn-primary:hover:not(:disabled) {
  background: #2990ff;
}
.btn-secondary {
  background: var(--surface-2);
  color: var(--fg);
  border: 1px solid var(--hairline);
}
.btn-secondary:hover:not(:disabled) {
  background: var(--surface-3);
}
.btn-ghost {
  background: transparent;
  color: var(--fg-2);
}
.btn-ghost:hover:not(:disabled) {
  background: var(--surface);
  color: var(--fg);
}
.btn-danger {
  background: var(--danger);
  color: #fff;
}
.btn-danger-soft {
  background: var(--danger-soft);
  color: #ff6961;
  border: 1px solid rgba(255, 69, 58, 0.25);
}
.btn-danger-soft:hover:not(:disabled) {
  background: rgba(255, 69, 58, 0.24);
}
.btn svg { width: 16px; height: 16px; flex-shrink: 0; }

/* ─── Landing / compose ─────────────────────────────────────────── */
.landing {
  min-height: calc(100vh - var(--topbar-h) - 80px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-8) var(--space-4);
  text-align: center;
}
.landing-kicker {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: var(--space-3);
}
.landing h1 {
  font-size: clamp(32px, 6vw, var(--text-3xl));
  font-weight: 600;
  letter-spacing: var(--tracking-tight);
  line-height: var(--leading-tight);
  margin-bottom: var(--space-3);
  max-width: 14ch;
}
.landing-lead {
  color: var(--fg-2);
  font-size: var(--text-md);
  max-width: 36ch;
  margin: 0 auto var(--space-8);
  line-height: 1.45;
}

.compose-card {
  width: 100%;
  max-width: var(--compose-max);
  background: var(--surface-solid);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-2xl);
  box-shadow: var(--shadow-input);
  padding: var(--space-3);
  transition:
    border-color var(--motion-base) var(--ease-standard),
    box-shadow var(--motion-base) var(--ease-standard);
}
.compose-card:focus-within {
  border-color: rgba(10, 132, 255, 0.45);
  box-shadow: var(--shadow-input), 0 0 0 4px var(--accent-soft);
}
.compose-card.is-invalid {
  border-color: rgba(255, 69, 58, 0.55);
  box-shadow: var(--shadow-input), 0 0 0 4px var(--danger-soft);
  animation: shake 380ms var(--ease-out);
}
.compose-card.is-disabled {
  opacity: 0.55;
  pointer-events: none;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(3px); }
}

.compose-row {
  display: flex;
  align-items: flex-end;
  gap: var(--space-2);
}
.compose-input {
  flex: 1 1 auto;
  min-width: 0;
  resize: none;
  border: none;
  background: transparent;
  color: var(--fg);
  font: inherit;
  font-size: var(--text-md);
  line-height: 1.4;
  padding: 10px 12px;
  max-height: 160px;
  min-height: 44px;
  field-sizing: content;
}
.compose-input::placeholder { color: var(--meta); }
.compose-input:disabled { opacity: 0.6; }

.compose-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding: 4px 8px 2px;
  min-height: 28px;
}
.backend-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
}
.backend-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 0 3px var(--success-soft);
}
.backend-pill.is-offline .backend-dot {
  background: var(--danger);
  box-shadow: 0 0 0 3px var(--danger-soft);
}
.backend-pill.is-checking .backend-dot {
  background: var(--muted);
  box-shadow: none;
  animation: pulse-dot 1s ease infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

.inline-error {
  margin-top: var(--space-3);
  padding: 10px 14px;
  border-radius: var(--radius-md);
  background: var(--danger-soft);
  border: 1px solid rgba(255, 69, 58, 0.22);
  color: #ff8a84;
  font-size: var(--text-sm);
  text-align: left;
  max-width: var(--compose-max);
  width: 100%;
}

.examples {
  margin-top: var(--space-8);
  width: 100%;
  max-width: var(--compose-max);
}
.examples-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--meta);
  margin-bottom: var(--space-3);
}
.example-chips {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--space-2);
}
.chip {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  background: var(--surface);
  border: 1px solid var(--hairline);
  color: var(--fg-2);
  font-size: var(--text-xs);
  font-weight: 500;
  transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.chip:hover {
  background: var(--surface-2);
  color: var(--fg);
}

/* Follow-up compose (bottom sticky feel inside flow) */
.followup {
  margin-top: var(--space-8);
  padding-top: var(--space-6);
  border-top: 1px solid var(--hairline-soft);
}
.followup-hint {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  font-size: var(--text-xs);
  color: var(--muted);
}
.context-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  background: var(--surface);
  border: 1px solid var(--hairline);
  font-size: 11px;
  font-weight: 500;
  color: var(--fg-2);
}
.context-chip strong { color: var(--fg); font-weight: 600; }
.context-chip button {
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  margin-left: 2px;
}
.context-chip button:hover { text-decoration: underline; }

/* ─── History ───────────────────────────────────────────────────── */
.history {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  margin-bottom: var(--space-6);
}
.history-item {
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  background: var(--surface);
  overflow: hidden;
  transition: border-color var(--motion-base) var(--ease-standard);
}
.history-item:hover { border-color: var(--hairline-strong); }
.history-head {
  width: 100%;
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: 14px 16px;
  text-align: left;
  cursor: pointer;
}
.history-head:hover { background: var(--surface); }
.history-q {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--fg);
  line-height: 1.4;
}
.history-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  margin-top: 2px;
}
.history-body {
  display: none;
  padding: 0 16px 16px;
  border-top: 1px solid var(--hairline-soft);
}
.history-item.is-open .history-body { display: block; padding-top: 14px; }
.history-chevron {
  color: var(--muted);
  transition: transform var(--motion-base) var(--ease-panel);
  flex-shrink: 0;
  margin-top: 2px;
}
.history-item.is-open .history-chevron { transform: rotate(180deg); }

/* ─── Badges ────────────────────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 22px;
  padding: 0 8px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.01em;
  white-space: nowrap;
}
.badge-muted {
  background: var(--surface-2);
  color: var(--muted);
}
.badge-ok {
  background: var(--success-soft);
  color: #5ce07a;
}
.badge-warn {
  background: var(--warn-soft);
  color: #ffe04a;
}
.badge-danger {
  background: var(--danger-soft);
  color: #ff6961;
}
.badge-branch {
  background: var(--branch-soft);
  color: var(--branch-fg);
}
.badge-accent {
  background: var(--accent-soft);
  color: #64b5ff;
}
.badge-attempt {
  background: var(--branch-soft);
  color: var(--branch-fg);
  font-variant-numeric: tabular-nums;
}

/* ─── Active turn ───────────────────────────────────────────────── */
.turn {
  animation: fade-up 360ms var(--ease-out);
}
@keyframes fade-up {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.turn-query {
  font-size: var(--text-lg);
  font-weight: 600;
  letter-spacing: var(--tracking-tight);
  line-height: 1.25;
  margin-bottom: var(--space-5);
}
.turn-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
  flex-wrap: wrap;
}

/* ─── Stepper ───────────────────────────────────────────────────── */
.stepper {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-bottom: var(--space-6);
  position: relative;
}
.step {
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  background: transparent;
  overflow: hidden;
  transition:
    background var(--motion-base) var(--ease-standard),
    border-color var(--motion-base) var(--ease-standard);
}
.step.is-active {
  background: var(--surface);
  border-color: var(--hairline);
}
.step.is-branch.is-active,
.step.is-branch.is-done {
  /* warm branch identity */
}
.step.is-failed {
  background: var(--danger-soft);
  border-color: rgba(255, 69, 58, 0.2);
}
.step-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  text-align: left;
  cursor: default;
}
.step.is-done .step-head,
.step.is-failed .step-head {
  cursor: pointer;
}
.step.is-done .step-head:hover,
.step.is-failed .step-head:hover {
  background: var(--surface);
}
.step-marker {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--hairline-strong);
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  position: relative;
}
.step.is-active .step-marker {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.08);
}
.step.is-active .step-marker::after {
  content: "";
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 1px solid rgba(10, 132, 255, 0.25);
  animation: ring-pulse 1.6s var(--ease-standard) infinite;
}
.step.is-branch.is-active .step-marker {
  border-color: var(--branch);
  background: var(--branch-soft);
  color: var(--branch-fg);
  box-shadow: 0 0 0 4px rgba(255, 159, 10, 0.08);
}
.step.is-branch.is-active .step-marker::after {
  border-color: rgba(255, 159, 10, 0.3);
}
.step.is-done .step-marker {
  border-color: transparent;
  background: var(--success-soft);
  color: var(--success);
}
.step.is-branch.is-done .step-marker {
  background: var(--branch-soft);
  color: var(--branch-fg);
}
.step.is-failed .step-marker {
  border-color: transparent;
  background: var(--danger-soft);
  color: var(--danger);
}
.step.is-skipped .step-marker {
  opacity: 0.35;
}
@keyframes ring-pulse {
  0% { opacity: 0.8; transform: scale(0.92); }
  70% { opacity: 0; transform: scale(1.15); }
  100% { opacity: 0; transform: scale(1.15); }
}
.step-label {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--fg-2);
}
.step.is-active .step-label { color: var(--fg); font-weight: 600; }
.step.is-done .step-label { color: var(--fg-2); }
.step.is-skipped .step-label { color: var(--meta); }
.step-summary {
  font-size: var(--text-xs);
  color: var(--muted);
  font-weight: 400;
  margin-top: 2px;
}
.step-aside {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.step-body {
  display: none;
  padding: 0 14px 14px 48px;
  font-size: var(--text-sm);
  color: var(--fg-2);
}
.step.is-expanded .step-body { display: block; }
.step-detail-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.step-detail-list li {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  border: 1px solid var(--hairline-soft);
}
.step-detail-list strong {
  display: block;
  color: var(--fg);
  font-weight: 600;
  font-size: var(--text-xs);
  margin-bottom: 2px;
}
.step-detail-list span {
  color: var(--muted);
  font-size: var(--text-xs);
  line-height: 1.4;
}
.grade-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}
.grade-track {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--surface-3);
  overflow: hidden;
}
.grade-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--accent);
}
.grade-fill.is-low { background: var(--branch); }
.mono {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--fg-2);
}

.cancelled-banner,
.empty-banner,
.error-banner {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-5);
  border-radius: var(--radius-lg);
  border: 1px solid var(--hairline);
  background: var(--surface);
  margin-bottom: var(--space-5);
}
.cancelled-banner {
  border-color: var(--hairline-strong);
}
.empty-banner {
  border-color: rgba(255, 159, 10, 0.25);
  background: var(--branch-soft);
}
.error-banner {
  border-color: rgba(255, 69, 58, 0.25);
  background: var(--danger-soft);
}
.banner-title {
  font-size: var(--text-base);
  font-weight: 600;
  color: var(--fg);
}
.banner-body {
  font-size: var(--text-sm);
  color: var(--fg-2);
  line-height: 1.45;
}
.banner-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: 4px;
}

/* ─── Answer ────────────────────────────────────────────────────── */
.answer-block {
  margin-bottom: var(--space-6);
}
.degraded-flag {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  background: var(--warn-soft);
  border: 1px solid rgba(255, 214, 10, 0.28);
  margin-bottom: var(--space-4);
}
.degraded-flag svg {
  flex-shrink: 0;
  margin-top: 1px;
  color: var(--warn);
}
.degraded-flag strong {
  display: block;
  font-size: var(--text-sm);
  font-weight: 600;
  color: #ffe04a;
  margin-bottom: 2px;
}
.degraded-flag p {
  font-size: var(--text-xs);
  color: rgba(255, 224, 74, 0.85);
  line-height: 1.45;
}

.answer-card {
  padding: var(--space-5) var(--space-5) var(--space-4);
  border-radius: var(--radius-xl);
  background: var(--surface-solid);
  border: 1px solid var(--hairline);
  box-shadow: var(--shadow-sm);
}
.answer-text {
  font-size: var(--text-md);
  line-height: 1.6;
  color: var(--fg);
  max-width: 62ch;
}
.answer-text p + p { margin-top: 0.85em; }
.answer-text strong { font-weight: 600; }

.answer-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-5);
  padding-top: var(--space-4);
  border-top: 1px solid var(--hairline-soft);
}
.feedback-group {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin-left: auto;
  padding: 2px;
  border-radius: var(--radius-pill);
  background: var(--surface);
  border: 1px solid var(--hairline);
}
.feedback-group .btn {
  border-radius: var(--radius-pill);
  color: var(--muted);
}
.feedback-group .btn:hover:not(:disabled) {
  color: var(--fg);
  background: var(--surface-2);
}
.feedback-group .btn.is-selected {
  color: var(--fg);
  background: var(--surface-3);
}
.feedback-group .btn.is-selected[data-fb="up"] { color: var(--success); }
.feedback-group .btn.is-selected[data-fb="down"] { color: var(--danger); }
.feedback-recorded {
  font-size: 11px;
  color: var(--muted);
  margin-left: 6px;
}

.correction-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: var(--space-4);
}
.correction-panel {
  display: none;
  margin-bottom: var(--space-4);
  padding: 14px 16px;
  border-radius: var(--radius-md);
  background: var(--branch-soft);
  border: 1px solid rgba(255, 159, 10, 0.22);
  animation: fade-up 280ms var(--ease-out);
}
.correction-panel.is-open { display: block; }
.correction-panel h3 {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--branch-fg);
  margin-bottom: 10px;
}
.correction-grid {
  display: grid;
  gap: 10px;
}
.correction-row {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 10px;
  font-size: var(--text-xs);
}
.correction-row dt {
  color: var(--muted);
  font-weight: 500;
}
.correction-row dd {
  margin: 0;
  color: var(--fg-2);
  line-height: 1.4;
}

/* ─── Sources ───────────────────────────────────────────────────── */
.sources {
  margin-bottom: var(--space-4);
}
.sources-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--meta);
  margin-bottom: var(--space-3);
}
.sources-row {
  display: flex;
  gap: var(--space-3);
  overflow-x: auto;
  padding-bottom: var(--space-2);
  scroll-snap-type: x proximity;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--surface-3) transparent;
}
.source-card {
  flex: 0 0 220px;
  scroll-snap-align: start;
  text-align: left;
  padding: 14px;
  border-radius: var(--radius-lg);
  background: var(--surface);
  border: 1px solid var(--hairline);
  cursor: pointer;
  transition:
    background var(--motion-fast) var(--ease-standard),
    border-color var(--motion-fast) var(--ease-standard),
    transform var(--motion-fast) var(--ease-standard);
  min-height: 110px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.source-card:hover {
  background: var(--surface-2);
  border-color: var(--hairline-strong);
}
.source-card:active { transform: scale(0.985); }
.source-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.source-idx {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--fg-2);
  flex-shrink: 0;
}
.source-title {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--fg);
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.source-snippet {
  font-size: var(--text-xs);
  color: var(--muted);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-top: auto;
}

/* ─── Drawer ────────────────────────────────────────────────────── */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--motion-panel) var(--ease-panel);
  z-index: var(--z-backdrop);
}
.drawer-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(440px, 100vw);
  background: rgba(18, 18, 20, 0.92);
  backdrop-filter: saturate(180%) blur(28px);
  -webkit-backdrop-filter: saturate(180%) blur(28px);
  border-left: 1px solid var(--hairline);
  box-shadow: var(--shadow-lg);
  transform: translateX(100%);
  transition: transform var(--motion-panel) var(--ease-panel);
  z-index: var(--z-drawer);
  display: flex;
  flex-direction: column;
}
.drawer.open { transform: translateX(0); }
.drawer-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-5);
  border-bottom: 1px solid var(--hairline);
}
.drawer-head h2 {
  font-size: var(--text-md);
  font-weight: 600;
  letter-spacing: var(--tracking-tight);
  line-height: 1.3;
  padding-right: var(--space-2);
}
.drawer-sub {
  margin-top: 6px;
  font-size: var(--text-xs);
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.drawer-body {
  flex: 1 1 auto;
  overflow: auto;
  padding: var(--space-5);
  font-size: var(--text-base);
  line-height: 1.6;
  color: var(--fg-2);
}
.drawer-body p + p { margin-top: 1em; }

/* ─── Modal ─────────────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: grid;
  place-items: center;
  padding: var(--space-5);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--motion-base) var(--ease-standard);
  z-index: var(--z-modal);
}
.modal-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}
.modal {
  width: min(400px, 100%);
  background: var(--surface-solid-2);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-xl);
  padding: var(--space-6);
  box-shadow: var(--shadow-lg);
  transform: scale(0.96) translateY(8px);
  transition: transform var(--motion-base) var(--ease-panel);
}
.modal-backdrop.open .modal {
  transform: scale(1) translateY(0);
}
.modal h3 {
  font-size: var(--text-lg);
  font-weight: 600;
  letter-spacing: var(--tracking-tight);
  margin-bottom: var(--space-2);
}
.modal p {
  font-size: var(--text-sm);
  color: var(--fg-2);
  line-height: 1.45;
  margin-bottom: var(--space-5);
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-2);
}

/* ─── Toast ─────────────────────────────────────────────────────── */
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%) translateY(12px);
  background: rgba(40, 40, 44, 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--hairline-strong);
  color: var(--fg);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: 10px 16px;
  border-radius: var(--radius-pill);
  box-shadow: var(--shadow-md);
  opacity: 0;
  pointer-events: none;
  transition:
    opacity var(--motion-base) var(--ease-standard),
    transform var(--motion-base) var(--ease-panel);
  z-index: var(--z-toast);
  max-width: min(90vw, 360px);
  text-align: center;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ─── Responsive ────────────────────────────────────────────────── */
@media (max-width: 560px) {
  .main-inner { padding: var(--space-5) var(--space-4) var(--space-12); }
  .landing h1 { max-width: none; }
  .correction-row { grid-template-columns: 1fr; gap: 2px; }
  .answer-actions { gap: 6px; }
  .feedback-group { margin-left: 0; width: 100%; justify-content: center; }
  .source-card { flex-basis: 180px; }
  .drawer { width: 100vw; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .step.is-active .step-marker::after { display: none; }
  .compose-card.is-invalid { animation: none; }
  .turn { animation: none; }
}
  </style>
