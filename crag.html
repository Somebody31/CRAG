<body>
  <div class="app" id="app" data-od-id="app-shell">
    <header class="topbar" id="topbar" data-od-id="topbar">
      <div class="brand" data-od-id="brand">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span class="brand-name">CRAG</span>
        <span class="brand-sub">Corrective RAG</span>
      </div>
      <div class="topbar-actions" id="topbar-actions" data-od-id="topbar-actions"></div>
    </header>

    <main class="main" id="main" data-od-id="main" role="main">
      <div class="main-inner" id="main-inner"></div>
    </main>
  </div>

  <!-- Source drawer -->
  <div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true"></div>
  <aside
    class="drawer"
    id="drawer"
    role="dialog"
    aria-modal="true"
    aria-labelledby="drawer-title"
    aria-hidden="true"
    data-od-id="drawer"
  >
    <div class="drawer-head">
      <div>
        <h2 id="drawer-title">Source</h2>
        <div class="drawer-sub" id="drawer-sub"></div>
      </div>
      <button type="button" class="btn btn-sm btn-ghost btn-icon" id="drawer-close" aria-label="Close drawer">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <!-- Clear conversation confirm -->
  <div class="modal-backdrop" id="clear-modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="clear-modal-title">
      <h3 id="clear-modal-title">Clear conversation?</h3>
      <p>This removes every turn in the current session. You can’t undo this.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-md btn-secondary" id="clear-modal-cancel">Keep</button>
        <button type="button" class="btn btn-md btn-danger" id="clear-modal-confirm">Clear</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" data-od-id="toast"></div>
  <div class="sr-only" id="live-region" aria-live="polite" aria-atomic="true"></div>

  <script>
(function () {
  "use strict";

  /* ─── Constants ───────────────────────────────────────────────── */
  const MAX_CORRECTION_ATTEMPTS = 2;
  const STAGE_DELAY = { min: 480, max: 1100 };

  const STAGE_META = {
    retrieving: { label: "Retrieving documents", branch: false },
    grading: { label: "Grading relevance", branch: false },
    correcting: { label: "Correcting / re-querying", branch: true },
    generating: { label: "Generating answer", branch: false }
  };

  const MOCK_CORPUS = [
    {
      id: "d1",
      title: "Corrective Retrieval Augmented Generation",
      snippet: "CRAG evaluates retrieved documents and triggers web search or re-query when relevance is low.",
      body: "Corrective Retrieval Augmented Generation (CRAG) introduces a lightweight retrieval evaluator that assesses the overall quality of documents returned for a query. When the evaluator judges the set as incorrect or ambiguous, a corrective action rewrites the query and fetches additional evidence before generation. This reduces the chance that a language model will answer from weak or irrelevant context.",
      score: 0.91
    },
    {
      id: "d2",
      title: "Retrieval-Augmented Generation Survey",
      snippet: "Survey of RAG architectures covering dense retrieval, re-ranking, and faithfulness evaluation.",
      body: "Retrieval-augmented generation combines parametric knowledge in large language models with non-parametric memory from external corpora. Dense retrievers map queries and passages into a shared embedding space. Re-rankers refine the top-k set. Faithfulness metrics check whether generated claims are supported by retrieved evidence. CRAG sits in the family of adaptive RAG systems that intervene when retrieval quality is poor.",
      score: 0.78
    },
    {
      id: "d3",
      title: "Document Relevance Grading Heuristics",
      snippet: "Practical heuristics for scoring passage relevance prior to answer synthesis.",
      body: "Relevance grading can be implemented with a small LLM judge that scores each passage for topical overlap, specificity, and support for answering the user question. Aggregate scores below a threshold indicate the need for query reformulation. Partial relevance may still allow generation with an explicit confidence disclaimer.",
      score: 0.64
    },
    {
      id: "d4",
      title: "Query Rewriting for Multi-Hop QA",
      snippet: "Techniques for decomposing and rewriting ambiguous questions into retrieval-friendly forms.",
      body: "Query rewriting improves recall when the original phrasing is vague or multi-hop. Effective rewrites preserve user intent while expanding entities, synonyms, and constraint language. In corrective pipelines, rewrites are only applied after an insufficient grade to avoid unnecessary latency on clean retrievals.",
      score: 0.72
    },
    {
      id: "d5",
      title: "Grounding and Hallucination Controls",
      snippet: "Operational patterns for flagging answers when supporting evidence is weak.",
      body: "When evidence remains weak after correction attempts, systems should still answer if required by product policy, but surface a degraded-result flag near the answer content. Users must be able to inspect sources and correction history. Silent fallbacks undermine trust more than an explicit low-confidence notice.",
      score: 0.55
    },
    {
      id: "d6",
      title: "Hybrid Search Operations Notes",
      snippet: "Combining sparse BM25 with dense vectors for production retrieval stacks.",
      body: "Hybrid retrieval blends lexical matching with semantic similarity. Fusion methods such as reciprocal rank fusion are common. Correction loops often benefit from hybrid search because rewritten queries may recover exact entity strings that pure dense retrieval missed.",
      score: 0.69
    }
  ];

  const EXAMPLES = [
    { q: "How does corrective RAG improve answer faithfulness?", scenario: "clean" },
    { q: "What is the latency tradeoff of multi-hop correction?", scenario: "correct" },
    { q: "Summarize the degraded fallback policy for weak evidence", scenario: "degraded" },
    { q: "no sources about fictional quantum tea protocols", scenario: "empty" },
    { q: "force a timeout during retrieval evaluation", scenario: "timeout" }
  ];

  /* ─── State ───────────────────────────────────────────────────── */
  const state = {
    backend: "checking", // checking | online | offline
    turns: [],
    useConversationContext: true,
    abortController: null,
    regeneratingTurnId: null,
    drawerSource: null,
    clearModalOpen: false,
    focusRestore: null
  };

  let toastTimer = null;
  let uid = 0;
  function nextId(prefix) {
    uid += 1;
    return prefix + "-" + uid;
  }

  /* ─── DOM helpers ─────────────────────────────────────────────── */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function escapeAttr(s) {
    return escapeHtml(s).replace(/'/g, "&#39;");
  }

  function announce(msg) {
    const el = $("#live-region");
    el.textContent = "";
    requestAnimationFrame(() => {
      el.textContent = msg;
    });
  }

  /* ─── Overlay a11y ────────────────────────────────────────────── */
  let focusTrapCleanup = null;
  let bodyLockCount = 0;

  function lockBodyScroll() {
    bodyLockCount += 1;
    if (bodyLockCount === 1) document.documentElement.style.overflow = "hidden";
  }
  function unlockBodyScroll() {
    bodyLockCount = Math.max(0, bodyLockCount - 1);
    if (bodyLockCount === 0) document.documentElement.style.overflow = "";
  }
  function getFocusable(root) {
    if (!root) return [];
    return $$(
      'a[href], button:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])',
      root
    ).filter((el) => !el.hasAttribute("disabled") && el.getClientRects().length > 0);
  }
  function trapFocus(root) {
    releaseFocusTrap();
    const onKey = (e) => {
      if (e.key !== "Tab") return;
      const nodes = getFocusable(root);
      if (!nodes.length) return;
      const first = nodes[0];
      const last = nodes[nodes.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    };
    document.addEventListener("keydown", onKey);
    focusTrapCleanup = () => {
      document.removeEventListener("keydown", onKey);
      focusTrapCleanup = null;
    };
  }
  function releaseFocusTrap() {
    if (focusTrapCleanup) focusTrapCleanup();
  }

  function showToast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  /* ─── Backend check ───────────────────────────────────────────── */
  /** Mock pipeline when ?mock=1, offline demo, or window.__CRAG_FORCE_MOCK */
  function useMockPipeline() {
    const params = new URLSearchParams(location.search);
    return (
      params.get("mock") === "1" ||
      params.get("offline") === "1" ||
      window.__CRAG_FORCE_MOCK === true
    );
  }

  function checkBackend() {
    state.backend = "checking";
    render();
    const params = new URLSearchParams(location.search);
    const forceOffline =
      params.get("offline") === "1" || window.__CRAG_FORCE_OFFLINE === true;
    if (forceOffline) {
      return delay(200).then(() => {
        state.backend = "offline";
        render();
        return state.backend;
      });
    }
    // Demo / UI-test mock does not need a live API.
    if (useMockPipeline()) {
      return delay(200).then(() => {
        state.backend = "online";
        render();
        return state.backend;
      });
    }
    // Real backend: probe /health
    return fetch("/health", { method: "GET" })
      .then((res) => {
        state.backend = res.ok ? "online" : "offline";
        render();
        return state.backend;
      })
      .catch(() => {
        state.backend = "offline";
        render();
        return state.backend;
      });
  }

  /* ─── Scenario routing ────────────────────────────────────────── */
  function detectScenario(query) {
    const q = query.toLowerCase();
    if (/\b(no sources?|zero docs?|empty|fictional quantum)\b/.test(q)) return "empty";
    if (/\b(timeout|force a timeout|stage fail)\b/.test(q)) return "timeout";
    if (/\b(degraded|weak evidence|fallback policy)\b/.test(q)) return "degraded";
    if (/\b(latency|multi-hop|correction|rewrite)\b/.test(q)) return "correct";
    if (/\b(corrective|faithfulness|crag)\b/.test(q)) return "clean";
    // Default: alternate for variety based on turn count
    return state.turns.length % 3 === 1 ? "correct" : "clean";
  }

  /* ─── Mock pipeline primitives ────────────────────────────────── */
  function delay(ms, signal) {
    return new Promise((resolve, reject) => {
      const t = setTimeout(resolve, ms);
      if (signal) {
        if (signal.aborted) {
          clearTimeout(t);
          reject(new DOMException("Aborted", "AbortError"));
          return;
        }
        const onAbort = () => {
          clearTimeout(t);
          reject(new DOMException("Aborted", "AbortError"));
        };
        signal.addEventListener("abort", onAbort, { once: true });
      }
    });
  }

  function stageWait(signal) {
    const ms = STAGE_DELAY.min + Math.random() * (STAGE_DELAY.max - STAGE_DELAY.min);
    return delay(ms, signal);
  }

  function cloneDoc(d, extra) {
    return Object.assign({}, d, extra || {});
  }

  function mockRetrieve(query, signal, opts) {
    opts = opts || {};
    return stageWait(signal).then(() => {
      if (opts.scenario === "empty" && !opts.fromCorrection) return [];
      const fromCorrection = !!opts.fromCorrection;
      if (fromCorrection) {
        return [
          cloneDoc(MOCK_CORPUS[3], { fromCorrection: true, score: 0.86 }),
          cloneDoc(MOCK_CORPUS[5], { fromCorrection: true, score: 0.81 })
        ];
      }
      if (opts.scenario === "degraded") {
        return [
          cloneDoc(MOCK_CORPUS[4], { score: 0.42 }),
          cloneDoc(MOCK_CORPUS[2], { score: 0.38 })
        ];
      }
      if (opts.scenario === "correct" && !opts.afterCorrection) {
        return [
          cloneDoc(MOCK_CORPUS[2], { score: 0.41 }),
          cloneDoc(MOCK_CORPUS[4], { score: 0.36 })
        ];
      }
      // clean
      return [
        cloneDoc(MOCK_CORPUS[0], { score: 0.91 }),
        cloneDoc(MOCK_CORPUS[1], { score: 0.78 }),
        cloneDoc(MOCK_CORPUS[5], { score: 0.69 })
      ];
    });
  }

  function mockGrade(docs, signal, opts) {
    opts = opts || {};
    return stageWait(signal).then(() => {
      if (opts.forceTimeout) {
        const err = new Error("Stage timed out while grading relevance");
        err.code = "TIMEOUT";
        throw err;
      }
      const avg =
        docs.reduce((s, d) => s + (d.score || 0), 0) / Math.max(docs.length, 1);
      const grades = docs.map((d) => ({
        id: d.id,
        title: d.title,
        score: d.score,
        label: d.score >= 0.6 ? "relevant" : "low relevance"
      }));
      // degraded scenario: always insufficient until attempts exhausted
      if (opts.scenario === "degraded") {
        return { sufficient: false, avg, grades, reason: "Initial documents scored low relevance" };
      }
      if (opts.scenario === "correct" && !opts.allowSufficient) {
        return { sufficient: false, avg, grades, reason: "Initial documents scored low relevance" };
      }
      const sufficient = avg >= 0.6 || opts.allowSufficient;
      return {
        sufficient,
        avg,
        grades,
        reason: sufficient ? "Documents meet relevance threshold" : "Initial documents scored low relevance"
      };
    });
  }

  function mockRewrite(query, attempt, signal) {
    return stageWait(signal).then(() => {
      const base = query.replace(/\?+$/, "").trim();
      if (attempt === 1) {
        return base + " — expand key entities and retrieval terms";
      }
      return base + " — hybrid keywords + constraints for grounding";
    });
  }

  function mockGenerate(turn, docs, signal) {
    return stageWait(signal).then(() => {
      const titles = docs.map((d) => d.title);
      const ctxNote = turn.usesContext
        ? " This answer also considers earlier turns in the conversation."
        : "";
      const degradeNote = turn.degraded
        ? " Supporting evidence remained weak after correction; treat claims carefully."
        : "";
      const p1 =
        "Based on the retrieved sources, <strong>" +
        escapeHtml(turn.query.replace(/\?+$/, "")) +
        "</strong> is best understood through a corrective retrieval loop: retrieve, grade relevance, and only rewrite when the evidence set is weak.";
      const p2 =
        "The strongest grounding comes from " +
        titles
          .slice(0, 2)
          .map((t) => "“" + escapeHtml(t) + "”")
          .join(" and ") +
        ". " +
        (turn.correctionAttempts
          ? "A correction pass rewrote the query and pulled additional passages before synthesis."
          : "No correction was required — the first retrieval was sufficient.") +
        degradeNote +
        ctxNote;
      return "<p>" + p1 + "</p><p>" + p2 + "</p>";
    });
  }

  function mergeDocs(existing, incoming) {
    const map = new Map();
    existing.forEach((d) => map.set(d.id, d));
    incoming.forEach((d) => {
      if (!map.has(d.id)) map.set(d.id, d);
      else {
        const prev = map.get(d.id);
        map.set(d.id, Object.assign({}, prev, d, { score: Math.max(prev.score || 0, d.score || 0) }));
      }
    });
    return Array.from(map.values());
  }

  /* ─── Turn factory ────────────────────────────────────────────── */
  function createTurn(query) {
    return {
      id: nextId("turn"),
      query: query,
      status: "running", // running | answered | degraded | cancelled | error | empty-retrieval
      scenario: detectScenario(query),
      usesContext: state.turns.length > 0 && state.useConversationContext,
      stages: {
        retrieving: { state: "pending", summary: "", detail: null },
        grading: { state: "pending", summary: "", detail: null },
        correcting: { state: "pending", summary: "", detail: null, attempts: [] },
        generating: { state: "pending", summary: "", detail: null }
      },
      activeStage: null,
      expandedStages: {},
      correctionAttempts: 0,
      correctionPanelOpen: false,
      rewrittenQueries: [],
      docs: [],
      sources: [],
      answerHtml: "",
      answerText: "",
      degraded: false,
      errorMessage: "",
      feedback: null, // 'up' | 'down' | null
      historyOpen: false,
      createdAt: Date.now()
    };
  }

  function setStage(turn, name, patch) {
    turn.activeStage = name;
    const st = turn.stages[name];
    st.state = "active";
    if (patch) Object.assign(st, patch);
    // mark prior linear stages done if needed handled by caller
    render();
    announce(STAGE_META[name].label);
  }

  function completeStage(turn, name, summary, detail) {
    const st = turn.stages[name];
    st.state = "done";
    st.summary = summary || "";
    if (detail !== undefined) st.detail = detail;
  }

  function failStage(turn, name, message) {
    turn.stages[name].state = "failed";
    turn.stages[name].summary = message;
    turn.activeStage = name;
    turn.status = "error";
    turn.errorMessage = message;
  }

  function isBusy() {
    return state.turns.some((t) => t.status === "running") || !!state.regeneratingTurnId;
  }

  function activeRunningTurn() {
    return state.turns.find((t) => t.status === "running") || null;
  }

  /* ─── Real backend pipeline (POST /api/query) ─────────────────── */
  function escapeAnswerHtml(text) {
    return escapeHtml(text).replace(/\n/g, "<br>");
  }

  async function runRealPipeline(turn, signal) {
    setStage(turn, "retrieving");
    const res = await fetch("/api/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: turn.query }),
      signal: signal
    });
    let data;
    try {
      data = await res.json();
    } catch (e) {
      failStage(turn, turn.activeStage || "retrieving", "Invalid JSON from /api/query");
      render();
      return;
    }

    if (!res.ok && data.status === "error") {
      failStage(
        turn,
        turn.activeStage || "retrieving",
        data.error || "Backend error " + res.status
      );
      render();
      announce("Pipeline error");
      return;
    }

    // Map documents
    const docs = (data.documents || []).map(function (d) {
      return {
        id: d.id,
        title: d.title,
        snippet: d.snippet || "",
        body: d.snippet || "",
        score: d.grade === "relevant" ? 0.9 : d.grade === "ambiguous" ? 0.55 : 0.2,
        fromCorrection: !!d.fromCorrection,
        grade: d.grade
      };
    });
    turn.docs = docs;
    turn.sources = docs.slice();
    turn.correctionAttempts = data.correctionAttempts || 0;
    turn.rewrittenQueries = data.rewrites || [];

    const stageNames = { retrieve: "retrieving", grade: "grading", correct: "correcting", generate: "generating", refuse: "generating" };
    const seen = {};
    (data.stages || []).forEach(function (s) {
      const ui = stageNames[s.name] || null;
      if (!ui || !turn.stages[ui]) return;
      seen[ui] = true;
      turn.stages[ui].state = s.ok ? "done" : "failed";
      turn.stages[ui].summary = s.detail || s.name;
    });
    // Mark unused stages
    ["retrieving", "grading", "correcting", "generating"].forEach(function (k) {
      if (!seen[k] && turn.stages[k].state === "pending") {
        turn.stages[k].state = "skipped";
        turn.stages[k].summary = "Not needed";
      }
    });

    if (data.correctionAttempts > 0 && turn.stages.correcting.state === "skipped") {
      turn.stages.correcting.state = "done";
      turn.stages.correcting.summary = data.correctionAttempts + " rewrite(s)";
    }
    if (turn.rewrittenQueries.length) {
      turn.stages.correcting.attempts = turn.rewrittenQueries.map(function (q, i) {
        return { attempt: i + 1, rewrittenQuery: q, newDocIds: [], newDocs: [] };
      });
    }

    turn.activeStage = null;
    if (data.status === "answered") {
      turn.status = "answered";
      turn.answerHtml = escapeAnswerHtml(data.answer || "");
      turn.answerText = data.answer || "";
      turn.degraded = false;
      announce("Answer ready");
    } else if (data.status === "refused") {
      turn.status = "refused";
      turn.answerHtml = "";
      turn.answerText = data.refusal || "I don't know based on the available documents.";
      turn.refusalMessage = turn.answerText;
      turn.degraded = false;
      if (turn.stages.generating.state === "pending" || turn.stages.generating.state === "skipped") {
        turn.stages.generating.state = "done";
        turn.stages.generating.summary = "Refused — weak evidence";
      }
      announce("Could not answer from knowledge base");
    } else {
      failStage(turn, "generating", data.error || "Unknown backend status");
      announce("Pipeline error");
    }
    render();
  }

  /* ─── Pipeline ────────────────────────────────────────────────── */
  async function runPipeline(turn, signal) {
    try {
      if (!useMockPipeline()) {
        await runRealPipeline(turn, signal);
        return;
      }

      // 1. Retrieve (mock / demo)
      setStage(turn, "retrieving");
      let docs = await mockRetrieve(turn.query, signal, { scenario: turn.scenario });
      turn.docs = docs;

      if (turn.scenario === "timeout") {
        // Fail during grading after retrieve shows docs path briefly
        completeStage(turn, "retrieving", docs.length + " documents", {
          docs: docs.map((d) => ({ title: d.title, score: d.score, fromCorrection: !!d.fromCorrection }))
        });
        setStage(turn, "grading");
        await mockGrade(docs, signal, { forceTimeout: true });
      }

      if (!docs.length) {
        completeStage(turn, "retrieving", "No documents found", { docs: [] });
        turn.activeStage = null;
        turn.status = "empty-retrieval";
        // skip remaining stages
        ["grading", "correcting", "generating"].forEach((k) => {
          turn.stages[k].state = "skipped";
        });
        render();
        announce("No documents retrieved");
        return;
      }

      completeStage(turn, "retrieving", docs.length + " document" + (docs.length === 1 ? "" : "s"), {
        docs: docs.map((d) => ({ title: d.title, score: d.score, fromCorrection: !!d.fromCorrection }))
      });

      // Grade / correct loop
      let attempt = 0;
      let allowSufficient = turn.scenario === "clean";
      let grade;
      let lastInsufficientReason = "Initial documents scored low relevance";

      while (true) {
        setStage(turn, "grading");
        grade = await mockGrade(docs, signal, {
          scenario: turn.scenario,
          // After any correction pass, allow sufficient grades (except degraded demos)
          allowSufficient: turn.scenario === "degraded" ? false : allowSufficient || attempt > 0
        });
        // Degraded demo: force insufficient until the attempt cap
        if (turn.scenario === "degraded") {
          grade.sufficient = false;
          grade.reason = "Initial documents scored low relevance";
        }

        completeStage(
          turn,
          "grading",
          grade.sufficient
            ? "Sufficient · avg " + Math.round(grade.avg * 100) + "%"
            : "Insufficient · avg " + Math.round(grade.avg * 100) + "%",
          { grades: grade.grades, reason: grade.reason, sufficient: grade.sufficient }
        );

        if (grade.sufficient) break;

        lastInsufficientReason = grade.reason || lastInsufficientReason;

        // Already used the full correction budget — generate degraded answer
        if (attempt >= MAX_CORRECTION_ATTEMPTS) {
          turn.degraded = true;
          turn.correctionAttempts = attempt;
          if (turn.stages.correcting.attempts.length) {
            turn.stages.correcting.state = "done";
            turn.stages.correcting.summary =
              "Max attempts (" + MAX_CORRECTION_ATTEMPTS + ") · proceeding degraded";
          } else {
            turn.stages.correcting.state = "skipped";
          }
          break;
        }

        attempt += 1;
        turn.correctionAttempts = attempt;

        setStage(turn, "correcting", { attempt: attempt });
        const rewritten = await mockRewrite(turn.query, attempt, signal);
        turn.rewrittenQueries.push(rewritten);

        const newDocs = await mockRetrieve(rewritten, signal, {
          scenario: turn.scenario,
          fromCorrection: true,
          afterCorrection: true
        });
        docs = mergeDocs(docs, newDocs);
        turn.docs = docs;

        turn.stages.correcting.attempts.push({
          attempt: attempt,
          rewrittenQuery: rewritten,
          newDocIds: newDocs.map((d) => d.id),
          newDocs: newDocs.map((d) => d.title)
        });
        completeStage(
          turn,
          "correcting",
          "Attempt " + attempt + " · +" + newDocs.length + " sources",
          {
            attempts: turn.stages.correcting.attempts.slice(),
            trigger: lastInsufficientReason
          }
        );

        // After correction, re-grade (degraded stays insufficient until cap)
        allowSufficient = turn.scenario !== "degraded";
      }

      // Generate even if degraded
      setStage(turn, "generating");
      const html = await mockGenerate(turn, docs, signal);
      turn.answerHtml = html;
      turn.answerText = html.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
      turn.sources = docs.slice();
      completeStage(turn, "generating", "Answer ready", null);

      // If correcting never ran, mark skipped
      if (turn.stages.correcting.state === "pending") {
        turn.stages.correcting.state = "skipped";
        turn.stages.correcting.summary = "Not needed";
      }

      turn.activeStage = null;
      turn.status = turn.degraded ? "degraded" : "answered";
      if (turn.degraded && turn.correctionAttempts > 0) {
        turn.correctionPanelOpen = false;
      }
      render();
      announce(turn.degraded ? "Answer ready with low-confidence flag" : "Answer ready");
    } catch (err) {
      if (err && err.name === "AbortError") {
        turn.status = "cancelled";
        turn.activeStage = null;
        Object.keys(turn.stages).forEach((k) => {
          if (turn.stages[k].state === "active") {
            turn.stages[k].state = "failed";
            turn.stages[k].summary = "Cancelled";
          } else if (turn.stages[k].state === "pending") {
            turn.stages[k].state = "skipped";
          }
        });
        render();
        announce("Run cancelled");
        return;
      }
      const msg = (err && err.message) || "Unexpected pipeline error";
      const active = turn.activeStage || "retrieving";
      failStage(turn, active, msg);
      render();
      announce("Pipeline error: " + msg);
    } finally {
      if (state.abortController && state.abortController.signal === signal) {
        state.abortController = null;
      }
      render();
    }
  }

  async function regenerateAnswer(turn) {
    if (isBusy() || !turn.sources.length) return;
    state.regeneratingTurnId = turn.id;
    turn.stages.generating.state = "active";
    turn.stages.generating.summary = "Regenerating…";
    turn.activeStage = "generating";
    render();
    announce("Regenerating answer");
    const controller = new AbortController();
    state.abortController = controller;
    try {
      // Keep prior docs; only generation
      const html = await mockGenerate(turn, turn.sources, controller.signal);
      turn.answerHtml = html;
      turn.answerText = html.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
      completeStage(turn, "generating", "Answer ready", null);
      turn.activeStage = null;
      turn.status = turn.degraded ? "degraded" : "answered";
      showToast("Answer regenerated");
    } catch (err) {
      if (err && err.name === "AbortError") {
        turn.stages.generating.state = "done";
        turn.stages.generating.summary = "Answer ready";
        turn.activeStage = null;
      } else {
        failStage(turn, "generating", (err && err.message) || "Regeneration failed");
      }
    } finally {
      state.regeneratingTurnId = null;
      state.abortController = null;
      render();
    }
  }

  /* ─── Actions ─────────────────────────────────────────────────── */
  function submitQuery(raw) {
    const query = (raw || "").trim();
    if (!query) {
      shakeCompose();
      return false;
    }
    if (state.backend === "offline") {
      render();
      return false;
    }
    if (isBusy()) return false;

    // Collapse previous open history items optional — keep expanded state
    const turn = createTurn(query);
    state.turns.push(turn);
    const controller = new AbortController();
    state.abortController = controller;
    render();
    runPipeline(turn, controller.signal);
    // scroll to latest
    requestAnimationFrame(() => {
      const el = document.getElementById("turn-" + turn.id);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    return true;
  }

  function cancelRun() {
    if (state.abortController) {
      state.abortController.abort();
    }
  }

  function retryTurn(turn) {
    if (isBusy()) return;
    // Replace with fresh run of same query
    const idx = state.turns.indexOf(turn);
    const fresh = createTurn(turn.query);
    // preserve context flag from original
    fresh.usesContext = turn.usesContext;
    if (idx >= 0) state.turns[idx] = fresh;
    else state.turns.push(fresh);
    const controller = new AbortController();
    state.abortController = controller;
    render();
    runPipeline(fresh, controller.signal);
  }

  function clearConversation() {
    cancelRun();
    state.turns = [];
    state.clearModalOpen = false;
    closeDrawer();
    unlockAll();
    render();
    showToast("Conversation cleared");
  }

  function unlockAll() {
    releaseFocusTrap();
    while (bodyLockCount > 0) unlockBodyScroll();
  }

  function shakeCompose() {
    const card = $("#compose-card");
    if (!card) return;
    card.classList.remove("is-invalid");
    void card.offsetWidth;
    card.classList.add("is-invalid");
    const input = $("#compose-input");
    if (input) input.focus();
    setTimeout(() => card.classList.remove("is-invalid"), 450);
  }

  /* ─── Drawer / modal ──────────────────────────────────────────── */
  function openSourceDrawer(source) {
    state.drawerSource = source;
    state.focusRestore = document.activeElement;
    const drawer = $("#drawer");
    const backdrop = $("#drawer-backdrop");
    $("#drawer-title").textContent = source.title;
    const sub = $("#drawer-sub");
    sub.innerHTML =
      (source.fromCorrection
        ? '<span class="badge badge-branch">From correction</span>'
        : '<span class="badge badge-muted">Original retrieval</span>') +
      (typeof source.score === "number"
        ? '<span class="badge badge-accent">' + Math.round(source.score * 100) + "% relevance</span>"
        : "");
    $("#drawer-body").innerHTML = source.body
      .split(/\n+/)
      .map((p) => "<p>" + escapeHtml(p) + "</p>")
      .join("");
    drawer.classList.add("open");
    backdrop.classList.add("open");
    drawer.setAttribute("aria-hidden", "false");
    backdrop.setAttribute("aria-hidden", "false");
    lockBodyScroll();
    trapFocus(drawer);
    $("#drawer-close").focus();
  }

  function closeDrawer() {
    if (!state.drawerSource && !$("#drawer").classList.contains("open")) return;
    state.drawerSource = null;
    const drawer = $("#drawer");
    const backdrop = $("#drawer-backdrop");
    drawer.classList.remove("open");
    backdrop.classList.remove("open");
    drawer.setAttribute("aria-hidden", "true");
    backdrop.setAttribute("aria-hidden", "true");
    releaseFocusTrap();
    unlockBodyScroll();
    if (state.focusRestore && state.focusRestore.focus) {
      try { state.focusRestore.focus(); } catch (_) {}
    }
    state.focusRestore = null;
  }

  function openClearModal() {
    state.clearModalOpen = true;
    state.focusRestore = document.activeElement;
    const modal = $("#clear-modal");
    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
    lockBodyScroll();
    trapFocus(modal);
    $("#clear-modal-cancel").focus();
  }

  function closeClearModal() {
    state.clearModalOpen = false;
    const modal = $("#clear-modal");
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
    releaseFocusTrap();
    unlockBodyScroll();
    if (state.focusRestore && state.focusRestore.focus) {
      try { state.focusRestore.focus(); } catch (_) {}
    }
    state.focusRestore = null;
  }

  /* ─── Render helpers ──────────────────────────────────────────── */
  function statusBadge(status) {
    if (status === "answered") return '<span class="badge badge-ok">Answered</span>';
    if (status === "refused") return '<span class="badge badge-warn">Refused</span>';
    if (status === "degraded") return '<span class="badge badge-warn">Degraded</span>';
    if (status === "cancelled") return '<span class="badge badge-muted">Cancelled</span>';
    if (status === "error") return '<span class="badge badge-danger">Error</span>';
    if (status === "empty-retrieval") return '<span class="badge badge-branch">No sources</span>';
    if (status === "running") return '<span class="badge badge-accent">Running</span>';
    return '<span class="badge badge-muted">' + escapeHtml(status) + "</span>";
  }

  function markerIcon(stepState, isBranch) {
    if (stepState === "done") {
      return '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
    if (stepState === "failed") {
      return '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
    }
    if (stepState === "active") {
      return isBranch ? "!" : "";
    }
    return "";
  }

  function renderStageDetail(name, stage) {
    if (!stage.detail) return "<p class=\"step-summary\">No detail recorded.</p>";
    if (name === "retrieving" && stage.detail.docs) {
      if (!stage.detail.docs.length) return "<p>No documents returned for this query.</p>";
      return (
        '<ul class="step-detail-list">' +
        stage.detail.docs
          .map((d) => {
            return (
              "<li><strong>" +
              escapeHtml(d.title) +
              (d.fromCorrection ? ' <span class="badge badge-branch">Correction</span>' : "") +
              "</strong><span>Relevance " +
              Math.round((d.score || 0) * 100) +
              "%</span></li>"
            );
          })
          .join("") +
        "</ul>"
      );
    }
    if (name === "grading" && stage.detail.grades) {
      return (
        "<p style=\"margin-bottom:10px;font-size:12px;color:var(--muted)\">" +
        escapeHtml(stage.detail.reason || "") +
        "</p>" +
        '<ul class="step-detail-list">' +
        stage.detail.grades
          .map((g) => {
            const pct = Math.round((g.score || 0) * 100);
            const low = pct < 60;
            return (
              "<li><strong>" +
              escapeHtml(g.title) +
              "</strong><span>" +
              escapeHtml(g.label) +
              '</span><div class="grade-bar"><div class="grade-track"><div class="grade-fill' +
              (low ? " is-low" : "") +
              '" style="width:' +
              pct +
              '%"></div></div><span class="mono">' +
              pct +
              "%</span></div></li>"
            );
          })
          .join("") +
        "</ul>"
      );
    }
    if (name === "correcting" && stage.detail.attempts) {
      return (
        "<p style=\"margin-bottom:10px;font-size:12px;color:var(--muted)\">Triggered because: " +
        escapeHtml(stage.detail.trigger || "low relevance") +
        "</p>" +
        '<ul class="step-detail-list">' +
        stage.detail.attempts
          .map((a) => {
            return (
              "<li><strong>Attempt " +
              a.attempt +
              "</strong><span class=\"mono\">" +
              escapeHtml(a.rewrittenQuery) +
              "</span><span style=\"display:block;margin-top:4px\">New docs: " +
              escapeHtml(a.newDocs.join(", ")) +
              "</span></li>"
            );
          })
          .join("") +
        "</ul>"
      );
    }
    return "";
  }

  function renderStepper(turn) {
    const order = ["retrieving", "grading", "correcting", "generating"];
    // Correction is a conditional branch — only appear once the loop engages
    const showCorrecting =
      turn.activeStage === "correcting" ||
      turn.correctionAttempts > 0 ||
      turn.stages.correcting.state === "done" ||
      turn.stages.correcting.state === "failed" ||
      turn.stages.correcting.state === "active";

    return (
      '<div class="stepper" data-od-id="stepper" role="list" aria-label="Pipeline progress">' +
      order
        .filter((name) => name !== "correcting" || showCorrecting)
        .map((name) => {
          const meta = STAGE_META[name];
          const st = turn.stages[name];
          // while running and stage still pending and not yet reached — pending
          let visual = st.state;
          if (turn.status === "running" && st.state === "pending") visual = "pending";
          if (st.state === "skipped") visual = "skipped";

          const isBranch = meta.branch;
          const expanded = !!turn.expandedStages[name];
          const canExpand = st.state === "done" || st.state === "failed";
          const classes = [
            "step",
            isBranch ? "is-branch" : "",
            visual === "active" ? "is-active" : "",
            visual === "done" ? "is-done" : "",
            visual === "failed" ? "is-failed" : "",
            visual === "skipped" ? "is-skipped" : "",
            expanded && canExpand ? "is-expanded" : ""
          ]
            .filter(Boolean)
            .join(" ");

          const attemptBadge =
            name === "correcting" && (st.attempt || turn.correctionAttempts)
              ? '<span class="badge badge-attempt">Attempt ' +
                (st.attempt || turn.correctionAttempts) +
                "</span>"
              : "";

          const ariaCurrent = visual === "active" ? ' aria-current="step"' : "";

          return (
            '<div class="' +
            classes +
            '" role="listitem" data-stage="' +
            name +
            '"' +
            ariaCurrent +
            ">" +
            '<button type="button" class="step-head" data-action="toggle-stage" data-turn="' +
            escapeAttr(turn.id) +
            '" data-stage="' +
            name +
            '"' +
            (canExpand ? "" : " disabled") +
            ' aria-expanded="' +
            (expanded && canExpand ? "true" : "false") +
            '">' +
            '<span class="step-marker" aria-hidden="true">' +
            markerIcon(visual, isBranch) +
            "</span>" +
            '<span class="step-label">' +
            escapeHtml(meta.label) +
            (st.summary
              ? '<div class="step-summary">' + escapeHtml(st.summary) + "</div>"
              : "") +
            "</span>" +
            '<span class="step-aside">' +
            attemptBadge +
            "</span>" +
            "</button>" +
            (expanded && canExpand
              ? '<div class="step-body">' + renderStageDetail(name, st) + "</div>"
              : "") +
            "</div>"
          );
        })
        .join("") +
      "</div>"
    );
  }

  function renderSources(turn, idPrefix) {
    if (!turn.sources || !turn.sources.length) return "";
    return (
      '<div class="sources" data-od-id="sources">' +
      '<div class="sources-label">Sources</div>' +
      '<div class="sources-row">' +
      turn.sources
        .map((s, i) => {
          return (
            '<button type="button" class="source-card" data-action="open-source" data-turn="' +
            escapeAttr(turn.id) +
            '" data-src="' +
            escapeAttr(s.id) +
            '" data-prefix="' +
            escapeAttr(idPrefix || "") +
            '">' +
            '<div class="source-card-top">' +
            '<span class="source-idx">' +
            (i + 1) +
            "</span>" +
            (s.fromCorrection ? '<span class="badge badge-branch">Correction</span>' : "") +
            "</div>" +
            '<div class="source-title">' +
            escapeHtml(s.title) +
            "</div>" +
            '<div class="source-snippet">' +
            escapeHtml(s.snippet) +
            "</div>" +
            "</button>"
          );
        })
        .join("") +
      "</div></div>"
    );
  }

  function renderAnswerBlock(turn, opts) {
    opts = opts || {};
    const compact = !!opts.compact;
    const showActions = !compact && (turn.status === "answered" || turn.status === "degraded" || turn.status === "refused");

    let html = '<div class="answer-block" data-od-id="answer">';

    if (turn.correctionAttempts > 0 && (turn.status === "answered" || turn.status === "degraded")) {
      html +=
        '<div class="correction-toggle">' +
        '<button type="button" class="btn btn-sm btn-secondary" data-action="toggle-correction" data-turn="' +
        escapeAttr(turn.id) +
        '" aria-expanded="' +
        (turn.correctionPanelOpen ? "true" : "false") +
        '">' +
        '<span class="badge badge-branch">Corrected</span> ' +
        turn.correctionAttempts +
        " attempt" +
        (turn.correctionAttempts === 1 ? "" : "s") +
        " · details" +
        "</button></div>";

      html +=
        '<div class="correction-panel' +
        (turn.correctionPanelOpen ? " is-open" : "") +
        '" id="corr-' +
        escapeAttr(turn.id) +
        '">' +
        "<h3>Correction details</h3>" +
        '<dl class="correction-grid">' +
        '<div class="correction-row"><dt>Triggered by</dt><dd>' +
        escapeHtml(
          (turn.stages.grading.detail && turn.stages.grading.detail.reason) ||
            "Initial documents scored low relevance"
        ) +
        "</dd></div>" +
        '<div class="correction-row"><dt>Attempts</dt><dd>' +
        turn.correctionAttempts +
        (turn.degraded ? " (max reached)" : "") +
        "</dd></div>" +
        (turn.rewrittenQueries.length
          ? '<div class="correction-row"><dt>Rewritten query</dt><dd class="mono">' +
            escapeHtml(turn.rewrittenQueries[turn.rewrittenQueries.length - 1]) +
            "</dd></div>"
          : "") +
        '<div class="correction-row"><dt>New sources</dt><dd>' +
        escapeHtml(
          turn.sources
            .filter((s) => s.fromCorrection)
            .map((s) => s.title)
            .join(", ") || "—"
        ) +
        "</dd></div>" +
        "</dl></div>";
    }

    if (turn.status === "refused") {
      html +=
        '<div class="degraded-flag" role="status">' +
        '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.5L14 13.5H2L8 2.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6.5v3.2M8 11.3h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
        "<div><strong>Could not answer</strong>" +
        "<p>" +
        escapeHtml(
          turn.refusalMessage ||
            turn.answerText ||
            "I don't know based on the available knowledge base documents."
        ) +
        "</p></div></div>";
    } else if (turn.degraded && (turn.status === "degraded" || turn.status === "answered")) {
      html +=
        '<div class="degraded-flag" role="status">' +
        '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.5L14 13.5H2L8 2.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6.5v3.2M8 11.3h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
        "<div><strong>Low-confidence answer</strong>" +
        "<p>Correction attempts were exhausted and supporting documents still scored poorly. Review sources before relying on this response.</p></div></div>";
    }

    if (turn.status !== "refused") {
    html +=
      '<div class="answer-card"><div class="answer-text">' +
      turn.answerHtml +
      "</div>";

    if (showActions) {
      html +=
        '<div class="answer-actions">' +
        '<button type="button" class="btn btn-sm btn-secondary" data-action="copy" data-turn="' +
        escapeAttr(turn.id) +
        '">' +
        '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="5.5" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="1.3"/><path d="M3.5 10.5v-6A1 1 0 014.5 3.5h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>' +
        "Copy</button>" +
        '<button type="button" class="btn btn-sm btn-secondary" data-action="regenerate" data-turn="' +
        escapeAttr(turn.id) +
        '"' +
        (isBusy() ? " disabled" : "") +
        ">" +
        '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8a5 5 0 019.5-2.2M13 8a5 5 0 01-9.5 2.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M12.5 2.5v3h-3M3.5 13.5v-3h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        "Regenerate</button>" +
        '<div class="feedback-group" role="group" aria-label="Answer feedback">' +
        '<button type="button" class="btn btn-sm btn-icon' +
        (turn.feedback === "up" ? " is-selected" : "") +
        '" data-action="feedback" data-fb="up" data-turn="' +
        escapeAttr(turn.id) +
        '"' +
        (turn.feedback ? " disabled" : "") +
        ' aria-label="Thumbs up" aria-pressed="' +
        (turn.feedback === "up" ? "true" : "false") +
        '">' +
        '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5 7.5v5.5h6.2a1.2 1.2 0 001.15-.9l1-4A1.2 1.2 0 0012.2 6.5H9l.6-2.4A1.2 1.2 0 008.1 2.7L5 7.5zM5 13H3.4A1.4 1.4 0 012 11.6V8.9A1.4 1.4 0 013.4 7.5H5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>' +
        "</button>" +
        '<button type="button" class="btn btn-sm btn-icon' +
        (turn.feedback === "down" ? " is-selected" : "") +
        '" data-action="feedback" data-fb="down" data-turn="' +
        escapeAttr(turn.id) +
        '"' +
        (turn.feedback ? " disabled" : "") +
        ' aria-label="Thumbs down" aria-pressed="' +
        (turn.feedback === "down" ? "true" : "false") +
        '">' +
        '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11 8.5V3H4.8A1.2 1.2 0 003.65 3.9l-1 4A1.2 1.2 0 003.8 9.5H7l-.6 2.4a1.2 1.2 0 001.5 1.4L11 8.5zM11 3h1.6A1.4 1.4 0 0114 4.4v2.7A1.4 1.4 0 0112.6 8.5H11" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>' +
        "</button>" +
        (turn.feedback
          ? '<span class="feedback-recorded">Recorded</span>'
          : "") +
        "</div></div>";
    }

    html += "</div>"; // answer-card
    } // end non-refused answer card

    html += renderSources(turn, opts.idPrefix || "");
    html += "</div>";
    return html;
  }

  function renderTurnFull(turn) {
    let html =
      '<article class="turn" id="turn-' +
      escapeAttr(turn.id) +
      '" data-turn-id="' +
      escapeAttr(turn.id) +
      '">';

    html +=
      '<div class="turn-toolbar">' +
      statusBadge(turn.status) +
      (turn.usesContext
        ? '<span class="context-chip"><strong>Uses prior turns</strong></span>'
        : '<span class="context-chip">Standalone query</span>') +
      (turn.status === "running"
        ? '<button type="button" class="btn btn-sm btn-danger-soft" data-action="cancel">' +
          '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg>' +
          "Stop</button>"
        : "") +
      "</div>";

    html += '<h2 class="turn-query">' + escapeHtml(turn.query) + "</h2>";

    // Stepper for running / completed / error / cancelled (with partial)
    if (
      turn.status === "running" ||
      turn.status === "answered" ||
      turn.status === "refused" ||
      turn.status === "degraded" ||
      turn.status === "error" ||
      turn.status === "cancelled" ||
      turn.status === "empty-retrieval"
    ) {
      html += renderStepper(turn);
    }

    if (turn.status === "cancelled") {
      html +=
        '<div class="cancelled-banner">' +
        '<div class="banner-title">Cancelled</div>' +
        '<div class="banner-body">This run was stopped. No answer was generated. Partial step history is kept above.</div>' +
        '<div class="banner-actions">' +
        '<button type="button" class="btn btn-sm btn-secondary" data-action="retry" data-turn="' +
        escapeAttr(turn.id) +
        '">Retry query</button></div></div>';
    }

    if (turn.status === "empty-retrieval") {
      html +=
        '<div class="empty-banner">' +
        '<div class="banner-title">No documents found</div>' +
        '<div class="banner-body">Retrieval returned zero passages, so grading never ran. Try rephrasing the question or retry the same query.</div>' +
        '<div class="banner-actions">' +
        '<button type="button" class="btn btn-sm btn-primary" data-action="retry" data-turn="' +
        escapeAttr(turn.id) +
        '">Retry</button>' +
        '<button type="button" class="btn btn-sm btn-secondary" data-action="focus-compose">Rephrase</button>' +
        "</div></div>";
    }

    if (turn.status === "error") {
      html +=
        '<div class="error-banner">' +
        '<div class="banner-title">Stage failed</div>' +
        '<div class="banner-body">' +
        escapeHtml(turn.errorMessage || "An unexpected error stopped the pipeline.") +
        "</div>" +
        '<div class="banner-actions">' +
        '<button type="button" class="btn btn-sm btn-primary" data-action="retry" data-turn="' +
        escapeAttr(turn.id) +
        '">Retry pipeline</button></div></div>';
    }

    if (turn.status === "answered" || turn.status === "degraded") {
      html += renderAnswerBlock(turn);
    }

    html += "</article>";
    return html;
  }

  function renderHistoryItem(turn) {
    const open = turn.historyOpen;
    let body = "";
    if (open) {
      if (turn.status === "answered" || turn.status === "degraded") {
        body = renderAnswerBlock(turn, { compact: true });
      } else if (turn.status === "cancelled") {
        body = '<p class="banner-body">Cancelled — no answer.</p>';
      } else if (turn.status === "error") {
        body = '<p class="banner-body">' + escapeHtml(turn.errorMessage) + "</p>";
      } else if (turn.status === "empty-retrieval") {
        body = '<p class="banner-body">No documents retrieved.</p>';
      } else {
        body = '<p class="banner-body">In progress…</p>';
      }
    }
    return (
      '<div class="history-item' +
      (open ? " is-open" : "") +
      '" data-od-id="history-item">' +
      '<button type="button" class="history-head" data-action="toggle-history" data-turn="' +
      escapeAttr(turn.id) +
      '" aria-expanded="' +
      (open ? "true" : "false") +
      '">' +
      '<span class="history-q">' +
      escapeHtml(turn.query) +
      "</span>" +
      '<span class="history-meta">' +
      statusBadge(turn.status) +
      '<svg class="history-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      "</span></button>" +
      '<div class="history-body">' +
      body +
      "</div></div>"
    );
  }

  function renderCompose(opts) {
    opts = opts || {};
    const followup = !!opts.followup;
    const offline = state.backend === "offline";
    const busy = isBusy();
    const disabled = offline || busy;

    let backendClass = "backend-pill";
    let backendText = "Checking connection…";
    if (state.backend === "online") {
      backendClass += " is-online";
      backendText = "Backend ready";
    } else if (state.backend === "offline") {
      backendClass += " is-offline";
      backendText = "Backend unreachable";
    } else {
      backendClass += " is-checking";
    }

    const contextControl = followup
      ? '<div class="followup-hint">' +
        "<span>Ask a follow-up</span>" +
        '<span class="context-chip">' +
        (state.useConversationContext
          ? "<strong>Uses prior turns</strong>"
          : "<strong>Standalone</strong>") +
        ' · <button type="button" data-action="toggle-context">' +
        (state.useConversationContext ? "Use standalone" : "Use context") +
        "</button></span></div>"
      : "";

    return (
      (followup ? '<div class="followup" data-od-id="compose">' : '<div data-od-id="compose">') +
      contextControl +
      '<div class="compose-card' +
      (disabled ? " is-disabled" : "") +
      '" id="compose-card">' +
      '<div class="compose-row">' +
      '<textarea class="compose-input" id="compose-input" rows="1" placeholder="' +
      (followup ? "Ask a follow-up…" : "Ask anything about your knowledge base…") +
      '" aria-label="' +
      (followup ? "Follow-up question" : "Question") +
      '"' +
      (disabled ? " disabled" : "") +
      "></textarea>" +
      '<button type="button" class="btn btn-md btn-primary btn-icon" id="compose-submit" aria-label="Submit"' +
      (disabled ? " disabled" : "") +
      ">" +
      '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      "</button></div>" +
      '<div class="compose-meta"><span class="' +
      backendClass +
      '"><span class="backend-dot" aria-hidden="true"></span>' +
      backendText +
      "</span>" +
      (busy
        ? '<span style="font-size:11px;color:var(--muted)">Pipeline running…</span>'
        : '<span style="font-size:11px;color:var(--meta)">Enter to send</span>') +
      "</div></div>" +
      (offline
        ? '<div class="inline-error" role="alert">Can’t reach the backend. Check the service and reload — input stays disabled so nothing fails silently on submit.</div>'
        : "") +
      "</div>"
    );
  }

  function renderLanding() {
    return (
      '<div class="landing" data-od-id="landing">' +
      '<div class="landing-kicker">Corrective retrieval</div>' +
      "<h1>Ask with a retrieval loop that self-corrects</h1>" +
      '<p class="landing-lead">Documents are graded for relevance. Weak sets trigger a rewrite and re-fetch before the answer is written.</p>' +
      renderCompose({ followup: false }) +
      '<div class="examples">' +
      '<div class="examples-label">Try an example</div>' +
      '<div class="example-chips">' +
      EXAMPLES.map((ex) => {
        return (
          '<button type="button" class="chip" data-action="example" data-q="' +
          escapeAttr(ex.q) +
          '">' +
          escapeHtml(ex.q.length > 42 ? ex.q.slice(0, 40) + "…" : ex.q) +
          "</button>"
        );
      }).join("") +
      "</div></div></div>"
    );
  }

  function renderConversation() {
    const past = state.turns.slice(0, -1);
    const latest = state.turns[state.turns.length - 1];
    let html = "";

    if (past.length) {
      html +=
        '<div class="history" data-od-id="history" aria-label="Earlier turns">' +
        past.map(renderHistoryItem).join("") +
        "</div>";
    }

    html += renderTurnFull(latest);

    // Follow-up only when latest is not mid-run? Spec: persistent input once first turn completes — also available after cancel/error
    if (latest.status !== "running") {
      html += renderCompose({ followup: true });
    } else {
      // Still show disabled follow-up area? Spec: follow-up disabled until current resolves — show compose disabled
      html += renderCompose({ followup: true });
    }

    return html;
  }

  function renderTopbar() {
    const actions = $("#topbar-actions");
    const topbar = $("#topbar");
    if (!state.turns.length) {
      actions.innerHTML = "";
      topbar.classList.remove("has-border");
      return;
    }
    topbar.classList.add("has-border");
    const busy = isBusy();
    actions.innerHTML =
      (busy
        ? '<button type="button" class="btn btn-sm btn-danger-soft" data-action="cancel">Stop</button>'
        : "") +
      '<button type="button" class="btn btn-sm btn-ghost" data-action="clear-open"' +
      (busy ? " disabled" : "") +
      ">Clear</button>";
  }

  function render() {
    const main = $("#main-inner");
    const scrollEl = $("#main");
    const prevScroll = scrollEl.scrollTop;

    if (!state.turns.length) {
      main.innerHTML = renderLanding();
    } else {
      main.innerHTML = renderConversation();
    }
    renderTopbar();
    wire();

    // Preserve scroll position on re-renders during pipeline
    if (state.turns.length) {
      scrollEl.scrollTop = prevScroll;
    }
  }

  /* ─── Wire events ─────────────────────────────────────────────── */
  function autoSizeTextarea(el) {
    if (!el) return;
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 160) + "px";
  }

  function findTurn(id) {
    return state.turns.find((t) => t.id === id);
  }

  function findSource(turn, srcId) {
    return (turn.sources || turn.docs || []).find((s) => s.id === srcId);
  }

  function wire() {
    const input = $("#compose-input");
    const submit = $("#compose-submit");
    if (input) {
      autoSizeTextarea(input);
      input.addEventListener("input", () => autoSizeTextarea(input));
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          submitQuery(input.value);
        }
      });
    }
    if (submit) {
      submit.addEventListener("click", () => {
        submitQuery(input ? input.value : "");
      });
    }

    // Event delegation on main for stability
    // Re-bind via document level once — use onclick on main-inner
  }

  // Global click delegation (survives re-render)
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-action]");
    if (!t) return;
    const action = t.getAttribute("data-action");
    const turnId = t.getAttribute("data-turn");
    const turn = turnId ? findTurn(turnId) : null;

    if (action === "example") {
      if (isBusy() || state.backend === "offline") return;
      const q = t.getAttribute("data-q") || "";
      const input = $("#compose-input");
      if (input) {
        input.value = q;
        autoSizeTextarea(input);
      }
      submitQuery(q);
      return;
    }
    if (action === "cancel") {
      cancelRun();
      return;
    }
    if (action === "clear-open") {
      openClearModal();
      return;
    }
    if (action === "toggle-context") {
      state.useConversationContext = !state.useConversationContext;
      render();
      return;
    }
    if (action === "focus-compose") {
      const input = $("#compose-input");
      if (input) {
        input.disabled = false;
        input.focus();
      }
      return;
    }
    if (action === "retry" && turn) {
      retryTurn(turn);
      return;
    }
    if (action === "toggle-stage" && turn) {
      const stage = t.getAttribute("data-stage");
      const st = turn.stages[stage];
      if (st && (st.state === "done" || st.state === "failed")) {
        turn.expandedStages[stage] = !turn.expandedStages[stage];
        render();
      }
      return;
    }
    if (action === "toggle-history" && turn) {
      turn.historyOpen = !turn.historyOpen;
      render();
      return;
    }
    if (action === "toggle-correction" && turn) {
      turn.correctionPanelOpen = !turn.correctionPanelOpen;
      render();
      return;
    }
    if (action === "open-source" && turn) {
      const src = findSource(turn, t.getAttribute("data-src"));
      if (src) openSourceDrawer(src);
      return;
    }
    if (action === "copy" && turn) {
      const text = turn.answerText || "";
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          () => showToast("Copied"),
          () => fallbackCopy(text)
        );
      } else {
        fallbackCopy(text);
      }
      return;
    }
    if (action === "regenerate" && turn) {
      regenerateAnswer(turn);
      return;
    }
    if (action === "feedback" && turn) {
      if (turn.feedback) return;
      turn.feedback = t.getAttribute("data-fb");
      render();
      showToast("Thanks for the feedback");
      return;
    }
  });

  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      showToast("Copied");
    } catch (_) {
      showToast("Copy failed");
    }
    document.body.removeChild(ta);
  }

  // Drawer close triad
  $("#drawer-close").addEventListener("click", closeDrawer);
  $("#drawer-backdrop").addEventListener("click", closeDrawer);

  // Clear modal
  $("#clear-modal-cancel").addEventListener("click", closeClearModal);
  $("#clear-modal-confirm").addEventListener("click", () => {
    clearConversation();
  });
  $("#clear-modal").addEventListener("click", (e) => {
    if (e.target === $("#clear-modal")) closeClearModal();
  });

  // Escape closes topmost overlay
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (state.clearModalOpen) {
      closeClearModal();
      return;
    }
    if (state.drawerSource || $("#drawer").classList.contains("open")) {
      closeDrawer();
    }
  });

  // Topbar border on scroll
  $("#main").addEventListener(
    "scroll",
    () => {
      const topbar = $("#topbar");
      if (state.turns.length) topbar.classList.add("has-border");
      else topbar.classList.toggle("has-border", $("#main").scrollTop > 8);
    },
    { passive: true }
  );

  /* ─── Test surface ────────────────────────────────────────────── */
  window.__CragUI = {
    getState: () => state,
    submitQuery,
    cancelRun,
    clearConversation,
    checkBackend,
    forceOffline: (v) => {
      window.__CRAG_FORCE_OFFLINE = !!v;
      state.backend = v ? "offline" : "online";
      render();
    },
    openSourceDrawer,
    closeDrawer,
    MAX_CORRECTION_ATTEMPTS,
    detectScenario,
    render
  };

  /* ─── Boot ────────────────────────────────────────────────────── */
  render();
  checkBackend();
})();
  </script>
</body>
</html>
